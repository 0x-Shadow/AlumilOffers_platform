name: Build Windows Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag name for release (e.g. v1.3.1)'
        required: false
        default: 'v1.3.1'

permissions:
  contents: write

jobs:
  build:
    name: Build Windows Executable & Installer
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build executable with PyInstaller
        run: |
          pyinstaller --clean AluminaOffers.spec

      - name: Prepare executable for installer
        run: |
          copy dist\AluminaOffers.exe .\AluminaOffers.exe

      - name: Build Inno Setup Installer
        shell: powershell
        run: |
          if (Get-Command iscc -ErrorAction SilentlyContinue) {
              iscc installer.iss
          } elseif (Test-Path "C:\Program Files (x86)\Inno Setup 6\ISCC.exe") {
              & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss
          } else {
              choco install innosetup --no-progress
              & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss
          }

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AluminaOffers-Windows-Build
          path: |
            AluminaOffers.exe
            Setup_AluminaOffers_*.exe

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: ${{ github.event.inputs.tag || github.ref_name }} — Offer Discounts & Improved PDFs
          body: |
            ## AluminaOffers ${{ github.event.inputs.tag || github.ref_name }}

            ### Τι νέο υπάρχει (What's New)
            - 💸 **Εκπτώσεις προσφοράς**: Ορίστε ποσοστό έκπτωσης στα κουφώματα και δείτε αυτόματα την καθαρή αξία, τον ΦΠΑ και το τελικό σύνολο. Η εργασία δεν περιλαμβάνεται στην έκπτωση.
            - 📊 **Αναλυτική σύνοψη PDF**: Οι τιμές, η έκπτωση, η καθαρή αξία χωρίς ΦΠΑ και το τελικό σύνολο εμφανίζονται μαζί στην αρχή της προσφοράς.
            - 🪟 **Καλύτερη παρουσίαση προϊόντων**: Μεγαλύτερα σχέδια και προδιαγραφές κάτω από τη σύνοψη, χωρίς επανάληψη τιμών.
            - 🧾 **Ονόματα αρχείων ανά πελάτη**: Τα PDF αποθηκεύονται με το όνομα του πελάτη και τον αριθμό προσφοράς.
            - 📚 **Κατάλογος 26 μοντέλων**: Τα μοντέλα Alumil περιλαμβάνουν σχέδια και τεχνικές πληροφορίες.
            - 🔒 **100% Offline**: Όλα τα δεδομένα αποθηκεύονται τοπικά.

            ### Αρχεία Εγκατάστασης (Downloads)
            - **`Setup_AluminaOffers_1.3.1.exe`** *(Προτεινόμενο)*: Πλήρης αυτόματος οδηγός εγκατάστασης για Windows 10/11.
            - **`AluminaOffers.exe`**: Portable έκδοση χωρίς εγκατάσταση.
          files: |
            AluminaOffers.exe
            Setup_AluminaOffers_*.exe
          generate_release_notes: false
