name: Build Windows Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag name for release (e.g. v1.5.3)'
        required: false
        default: 'v1.5.3'

permissions:
  contents: write

jobs:
  build:
    name: Build Windows Executable & Installer
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Read app version
        id: app_version
        shell: pwsh
        run: |
          $match = Select-String -Path app.py -Pattern '__version__\s*=\s*"([^"]+)"'
          if (-not $match) { throw "Could not read __version__ from app.py" }
          $version = $match.Matches[0].Groups[1].Value
          "APP_VERSION=$version" >> $env:GITHUB_ENV
          "version=$version" >> $env:GITHUB_OUTPUT
          Write-Host "App version: $version"

      - name: Verify tag matches app version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}".TrimStart("v")
          if ($tag -ne $env:APP_VERSION) {
            throw "Tag $tag does not match app.py version $env:APP_VERSION — bump __version__ before tagging."
          }

      - name: Build executable with PyInstaller
        run: |
          pyinstaller --clean Europa.spec

      - name: Prepare executable for installer
        run: |
          copy dist\Europa.exe .\Europa.exe

      - name: Build Inno Setup Installer
        shell: powershell
        run: |
          if (Get-Command iscc -ErrorAction SilentlyContinue) {
              $iscc = "iscc"
          } elseif (Test-Path "C:\Program Files (x86)\Inno Setup 6\ISCC.exe") {
              $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          } else {
              choco install innosetup --no-progress
              $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          }
          & $iscc "/DMyAppVersion=$env:APP_VERSION" "installer.iss"
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed with exit code $LASTEXITCODE" }

      - name: Generate SHA-256 checksums
        shell: pwsh
        run: |
          $lines = @()
          $files = @("Europa.exe") + @(Get-ChildItem -Filter "Setup_Europa_*.exe" | ForEach-Object { $_.Name })
          foreach ($name in $files) {
            $item = Get-Item $name
            $hash = (Get-FileHash $item.FullName -Algorithm SHA256).Hash.ToLower()
            $lines += "$hash  $($item.Name)"
          }
          Set-Content -Path SHA256SUMS.txt -Value $lines -Encoding ascii
          Get-Content SHA256SUMS.txt

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Europa-Windows-Build
          path: |
            Europa.exe
            Setup_Europa_*.exe
            SHA256SUMS.txt

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: ${{ github.event.inputs.tag || github.ref_name }} — Europa
          body: |
            ## Europa ${{ steps.app_version.outputs.version }}

            ### Τι νέο υπάρχει (What's New)
            - 🔄 **Αυτόματες ενημερώσεις**: έλεγχος στην εκκίνηση, σύγχρονο παράθυρο ενημέρωσης, εγκατάσταση με ένα κλικ και επαλήθευση SHA-256.
            - 🏷️ **Νέο όνομα: Europa** — ίδια δεδομένα, ίδια προσφορές, νέα εμφάνιση.
            - 💾 **Τα δεδομένα σας είναι στο `%APPDATA%\Europa`** — ούτε ενημέρωση ούτε απεγκατάσταση μπορεί να σβήσει προσφορές και πελάτες.
            - 🧾 **Εξαγωγή για λογιστή** σε CSV/Excel, με ένα κλικ.
            - 🔒 **100% Offline**: All quote and customer data remains local.

            ### Αρχεία Εγκατάστασης (Downloads)
            - **`Setup_Europa_${{ steps.app_version.outputs.version }}.exe`** *(Προτεινόμενο)*: Πλήρης αυτόματος οδηγός εγκατάστασης για Windows 10/11.
            - **`Europa.exe`**: Portable έκδοση χωρίς εγκατάσταση.
            - **`SHA256SUMS.txt`**: hashes επαλήθευσης για τις λήψεις.
          files: |
            Europa.exe
            Setup_Europa_*.exe
            SHA256SUMS.txt
          generate_release_notes: false
