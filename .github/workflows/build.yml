name: Build Windows Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag name for release (e.g. v1.2.9)'
        required: false
        default: 'v1.2.9'

permissions:
  contents: write

jobs:
  build:
    name: Build Windows Executable & Installer
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build executable with PyInstaller
        run: |
          pyinstaller --clean AluminaOffers.spec

      - name: Prepare executable for installer
        run: |
          copy dist\AluminaOffers.exe .\AluminaOffers.exe

      - name: Build Inno Setup Installer
        shell: powershell
        run: |
          if (Get-Command iscc -ErrorAction SilentlyContinue) {
              iscc installer.iss
          } elseif (Test-Path "C:\Program Files (x86)\Inno Setup 6\ISCC.exe") {
              & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss
          } else {
              choco install innosetup --no-progress
              & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss
          }

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AluminaOffers-Windows-Build
          path: |
            AluminaOffers.exe
            Setup_AluminaOffers_*.exe

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: ${{ github.event.inputs.tag || github.ref_name }} — Dimensioned Images & Cleaner PDF
          body: |
            ## AluminaOffers ${{ github.event.inputs.tag || github.ref_name }}

            ### Τι νέο υπάρχει (What's New)
            - 📏 **Διαστάσεις σε κάθε εικόνα**: Οριζόντια και κάθετη γραμμή διαστάσεων με βέλη και ετικέτες σε cm (π.χ. `330 εκ.` × `235 εκ.`) γύρω από κάθε σχέδιο/εικόνα κουφώματος στο PDF — πιο επαγγελματική και ελκυστική παρουσίαση.
            - 🖼️ **Οι εικόνες δεν λείπουν πια**: Το PDF αναζητά αυτόματα την εικόνα της προσφοράς, κατόπιν στον κατάλογο (βάσει κωδικού/ονομασίας) και τελευταία εναλλακτικά σχεδιάζει αυτόματα το CAD σχέδιο από τις διαστάσεις. Το κελί εικόνας δεν εμφανίζει πλέον κενό.
            - 🙈 **Απόκρυψη αριθμού προσφοράς**: Η γραμμή `ΠΡΟΣΦΟΡΑ No: ...` αφαιρέθηκε από το PDF (κεφαλίδα & μεταδεδομένα) — ο αριθμός παραμένει μόνο στην εφαρμογή και στο όνομα αρχείου.
            - ✨ **Καθαρή διάταξη περιγραφής**: Ο τίτλος με κωδικό σε μία γραμμή, σειρά/χρώμα/διαστάσεις ξεχωριστά — καμία ακατάλληλη αλλαγή γραμμής.
            - 📁 **Ευρύτερα ονόματα αρχείων**: Εικόνες με κενά, παρενθέσεις και τελείες αναγνωρίζονται σωστά.
            - 🖼️ **Εικόνες σε κάθε υλικό**: Εικονίδια δίπλα σε κάθε γραμμή υλικού στο PDF με έξυπνη αντιστοίχιση λέξεων-κλειδιών (Ελληνικά & Αγγλικά).
            - 🧾 **Βελτιωμένο πίνακα τιμών**: Υλικό/Εργασία → Ποσ. → Μον. → Τιμή μον. → Σύνολο, με ξεχωριστή γραμμή ΕΡΓΑΣΙΑ & ΤΟΠΟΘΕΤΗΣΗΣ.
            - 🔒 **100% Offline & Ασφαλές**: Όλα τα δεδομένα αποθηκεύονται τοπικά στον υπολογιστή σας.

            ### Αρχεία Εγκατάστασης (Downloads)
            - **`Setup_AluminaOffers_1.2.9.exe`** *(Προτεινόμενο)*: Πλήρης αυτόματος οδηγός εγκατάστασης για Windows 10/11 (συντομεύσεις, απεγκατάσταση, χωρίς δικαιώματα διαχειριστή).
            - **`AluminaOffers.exe`**: Portable έκδοση χωρίς εγκατάσταση.
          files: |
            AluminaOffers.exe
            Setup_AluminaOffers_*.exe
          generate_release_notes: false
