name: Build Windows Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag name for release (e.g. v1.2.1)'
        required: false
        default: 'v1.2.1'

permissions:
  contents: write

jobs:
  build:
    name: Build Windows Executable & Installer
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build executable with PyInstaller
        run: |
          pyinstaller --clean AluminaOffers.spec

      - name: Prepare executable for installer
        run: |
          copy dist\AluminaOffers.exe .\AluminaOffers.exe

      - name: Build Inno Setup Installer
        shell: powershell
        run: |
          if (Get-Command iscc -ErrorAction SilentlyContinue) {
              iscc installer.iss
          } elseif (Test-Path "C:\Program Files (x86)\Inno Setup 6\ISCC.exe") {
              & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss
          } else {
              choco install innosetup --no-progress
              & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss
          }

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AluminaOffers-Windows-Build
          path: |
            AluminaOffers.exe
            Setup_AluminaOffers_*.exe

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: ${{ github.event.inputs.tag || github.ref_name }} — PDF Images & Bug Fixes
          body: |
            ## AluminaOffers ${{ github.event.inputs.tag || github.ref_name }}

            ### Τι νέο υπάρχει (What's New)
            - 🖼️ **Εικόνες στο PDF**: Πρόσθεση εικονίδων δίπλα σε κάθε υλικό στο PDF για πιο ελκυστική και κατανοητή παρουσίαση.
            - 📏 **Βελτιωμένη Εμφάνιση Περιγραφής**: Μικρότερη και πιο κομψή γραμματοσειρά για τις περιγραφές υλικών, καλύτερη αναγνωσιμότητα.
            - 🔍 **Έξυπνη Ανίχνευση Εικόνων**: Αυτόματη αντιστοίχιση εικόνων βάσει λέξεων-κλειδιών (Ελληνικά & Αγγλικά) όπως: συρόμενο, επάλληλο, πόρτα, σίτα, shutter, screen, casement, κ.ά.
            - 🐛 **Διόρθωση Σφαλμάτων**: Επίλυση προβλήματος με κουμπιά και λειτουργίες στη σελίδα «Νέα Προσφορά». Όλα τα κουμπιά, ο επιλογέας σχεδίων και τα δημοφιλή κουφώματα λειτουργούν πλέον σωστά.
            - ⚡ **Γρήγορη Μπάρα Δημοφιλών Κουφωμάτων (Quick Bar)**: Αυτόματη παρακολούθηση συχνότητας επιλογής (`use_count`). Τα πιο δημοφιλή κουφώματα εμφανίζονται στην κορυφή της «Νέας Προσφοράς» και προστίθενται με 1 μόνο κλικ!
            - 🛠️ **Ειδικό Πλαίσιο Εργασίας / Τοποθέτησης με Checkbox**: Επιλογή συμπερίληψης εργασίας στην προσφορά. Όταν είναι απενεργοποιημένο, η προσφορά παραμένει αποκλειστικά για υλικά/κουφώματα χωρίς αναφορά εργασίας στο PDF.
            - 📂 **Εύκολη Πρόσβαση & Κοινοποίηση PDF**:
              - Άμεσο άνοιγμα φακέλου με προ-επιλεγμένο το PDF αρχείο για ταχύτατο **drag & drop** σε **Viber, WhatsApp Desktop ή Email**.
              - Άνοιγμα WhatsApp Web με έτοιμο κείμενο προσφοράς και κουμπί άμεσης αντιγραφής διαδρομής.
              - Νέα κουμπιά `[📂]` (Φάκελος) και `[💬]` (Κοινοποίηση) σε κάθε γραμμή προσφοράς στην Αρχική οθόνη.
            - 📐 **Οπτικός Κατάλογος & Επιλογέας**: Διόρθωση focus & topmost παραθύρου για άμεση επιλογή χωρίς να χάνεται στο παρασκήνιο.
            - 📄 **Αναλογικά CAD Σχέδια**: Αυτόματη προσαρμογή αναλογιών (Π x Υ cm) σε κάθε τυπολογία (συρόμενα, επάλληλα, ανοιγόμενα, ρολά, σίτες).
              - Τελική έντονη τιμή ανά κούφωμα
            - 🧾 **Βελτιωμένο πίνακα τιμών στο PDF**: Καθαρή αξία → ΦΠΑ → Σύνολο με ΦΠΑ σε έναν ενωμένο, καθαρό πίνακα. Το ξεχωριστό πλαίσιο «Κόστος Εργασίας (χωρίς ΦΠΑ)» Δεν εμφανίζεται πλέον.
            - 🔒 **100% Offline & Ασφαλές**: Όλα τα δεδομένα αποθηκεύονται τοπικά στον υπολογιστή σας.

            ### Αρχεία Εγκατάστασης (Downloads)
            - **`Setup_AluminaOffers_1.2.7.exe`** *(Προτεινόμενο)*: Πλήρης αυτόματος οδηγός εγκατάστασης για Windows 10/11 (συντομεύσεις, απεγκατάσταση, χωρίς δικαιώματα διαχειριστή).
            - **`AluminaOffers.exe`**: Portable έκδοση χωρίς εγκατάσταση.
          files: |
            AluminaOffers.exe
            Setup_AluminaOffers_*.exe
          generate_release_notes: false
