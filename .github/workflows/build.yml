name: Build Windows Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag name for release (e.g. v1.3.0)'
        required: false
        default: 'v1.3.0'

permissions:
  contents: write

jobs:
  build:
    name: Build Windows Executable & Installer
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build executable with PyInstaller
        run: |
          pyinstaller --clean AluminaOffers.spec

      - name: Prepare executable for installer
        run: |
          copy dist\AluminaOffers.exe .\AluminaOffers.exe

      - name: Build Inno Setup Installer
        shell: powershell
        run: |
          if (Get-Command iscc -ErrorAction SilentlyContinue) {
              iscc installer.iss
          } elseif (Test-Path "C:\Program Files (x86)\Inno Setup 6\ISCC.exe") {
              & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss
          } else {
              choco install innosetup --no-progress
              & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss
          }

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AluminaOffers-Windows-Build
          path: |
            AluminaOffers.exe
            Setup_AluminaOffers_*.exe

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: ${{ github.event.inputs.tag || github.ref_name }} — Shorter Descriptions & Clean Catalog
          body: |
            ## AluminaOffers ${{ github.event.inputs.tag || github.ref_name }}

            ### Τι νέο υπάρχει (What's New)
            - 📝 **Συντομογραφίες προϊόντων**: Λιγότερες και συντομότερες περιγραφές στα σχέδια — το στοιχείο προϊόντα ταιριάζει καλύτερα στις στήλες με μικρότερο ύψος.
            - 🗑️ **Κατάλογος καταργήθηκε**: Αφαίρεση των 12 φωτογραφιών καταλόγου (images/) — μένουν μόνο τα αρχικά σχέδια Π-101 έως Π-110.
            - 🙈 **Απόκρυψη αριθμού προσφοράς**: Η γραμμή `ΠΡΟΣΦΟΡΑ No: ...` αφαιρέθηκε από το PDF.
            - 🖼️ **Εικόνες σχεδίων**: Κάθε σχέδιο εμφανίζει εικόνα ή αυτόματο CAD σχέδιο με διαστάσεις σε cm.
            - 🔒 **100% Offline & Ασφαλές**: Όλα τα δεδομένα αποθηκεύονται τοπικά.

            ### Αρχεία Εγκατάστασης (Downloads)
            - **`Setup_AluminaOffers_1.3.0.exe`** *(Προτεινόμενο)*: Πλήρης αυτόματος οδηγός εγκατάστασης για Windows 10/11.
            - **`AluminaOffers.exe`**: Portable έκδοση χωρίς εγκατάσταση.
          files: |
            AluminaOffers.exe
            Setup_AluminaOffers_*.exe
          generate_release_notes: false
